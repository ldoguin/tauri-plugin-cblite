[[permission]]
identifier = "allow-open-database"
description = "Allows opening a database."
commands.allow = ["open_database"]

[[permission]]
identifier = "allow-close-database"
description = "Allows closing the open database."
commands.allow = ["close_database"]

[[permission]]
identifier = "allow-get-document"
description = "Allows reading a document."
commands.allow = ["get_document"]

[[permission]]
identifier = "allow-save-document"
description = "Allows saving a document."
commands.allow = ["save_document"]

[[permission]]
identifier = "allow-start-replication"
description = "Allows starting replication."
commands.allow = ["start_replication"]

[[permission]]
identifier = "allow-stop-replication"
description = "Allows stopping replication."
commands.allow = ["stop_replication"]

[[permission]]
identifier = "allow-execute-query"
description = "Allows executing a database query."
commands.allow = ["execute_query"]

[[permission]]
identifier = "allow-create-fts-index"
description = "Allows creating a full-text search index on a collection."
commands.allow = ["create_fts_index"]

[[permission]]
identifier = "allow-list-indexes"
description = "Allows listing the indexes on a collection."
commands.allow = ["list_indexes"]

[[permission]]
identifier = "allow-enable-vector-search"
description = "Allows loading the Vector Search extension."
commands.allow = ["enable_vector_search"]

[[permission]]
identifier = "allow-create-vector-index"
description = "Allows creating a vector index on a collection."
commands.allow = ["create_vector_index"]

[[permission]]
identifier = "allow-save-blob"
description = "Allows saving a blob to the database."
commands.allow = ["save_blob"]

[[permission]]
identifier = "allow-get-blob-data"
description = "Allows retrieving blob data from the database."
commands.allow = ["get_blob_data"]

[[permission]]
identifier = "allow-write-export-file"
description = "Allows writing an export file to the user-accessible storage."
commands.allow = ["write_export_file"]

[[permission]]
identifier = "allow-register-listener"
description = "Allows registering Channel-based event listeners (mobile)."
commands.allow = ["registerListener"]

[[permission]]
identifier = "allow-remove-listener"
description = "Allows removing Channel-based event listeners (mobile)."
commands.allow = ["removeListener"]

[default]
description = "Default permission set — allows all plugin commands."
permissions = [
    "allow-start-peer-listener",
    "allow-stop-peer-listener",
    "allow-peer-listener-status",
    "allow-open-database",
    "allow-close-database",
    "allow-get-document",
    "allow-save-document",
    "allow-start-replication",
    "allow-stop-replication",
    "allow-execute-query",
    "allow-create-fts-index",
    "allow-list-indexes",
    "allow-enable-vector-search",
    "allow-create-vector-index",
    "allow-save-blob",
    "allow-get-blob-data",
    "allow-write-export-file",
    "allow-register-listener",
    "allow-remove-listener",
]

[[permission]]
identifier = "allow-start-peer-listener"
description = "Allows hosting peer-to-peer replication."
commands.allow = ["start_peer_listener"]

[[permission]]
identifier = "allow-stop-peer-listener"
description = "Allows stopping the peer-to-peer listener."
commands.allow = ["stop_peer_listener"]

[[permission]]
identifier = "allow-peer-listener-status"
description = "Allows reading peer-to-peer listener status."
commands.allow = ["peer_listener_status"]
