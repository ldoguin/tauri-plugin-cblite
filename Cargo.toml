[workspace]

[package]
name = "tauri-plugin-cblite"
version = "0.1.0"
edition = "2024"
description = "Tauri plugin wrapping couchbase-lite-rust"
license = "MIT"
links = "tauri-plugin-cblite"

[features]
# Pull in the native CBL C library (desktop only).  Automatically enabled by `enterprise`.
native-cbl = ["dep:couchbase_lite"]
# Enterprise: native CBL EE + ONNX predictive queries + field-level encryption.
enterprise = ["native-cbl", "couchbase_lite/enterprise", "dep:tract-onnx", "dep:pbkdf2", "dep:hmac", "dep:sha2"]

[dependencies]
# Optional: only present on desktop builds (Android uses the Kotlin CBL SDK instead).
couchbase_lite = { path = "../couchbase-lite-rust", optional = true, default-features = false }
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tract-onnx = { version = "0.21", optional = true }
pbkdf2 = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22" }



[build-dependencies]
tauri-plugin = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
